        <button class="cmd" id="flash-next">${S.idx+1>=S.queue.length?"> DONE":"NEXT &gt;"}</button>
      </div>
      <div style="text-align:center"><button class="cmd small" id="flash-exit" style="font-size:10px;padding:6px 10px;opacity:.7">exit flashcards</button></div>
    </div>`;
  $("star-btn").addEventListener("click",()=>{
    const on=toggleStar(q);
    const b=$("star-btn");b.classList.toggle("on",on);b.textContent=on?"★":"☆";b.setAttribute("aria-pressed",on);
  });
  $("flash-box").addEventListener("click",()=>{
    S.flashRevealed=!S.flashRevealed;
    const side=$("flash-side");
    const content=$("flash-content");
    if(S.flashRevealed){
      side.textContent="ANSWER · tap to flip back";
      content.innerHTML=`<div class="flash-a">${esc(correctText(q))}</div>${q.e?`<div class="flash-exp"><strong>Why:</strong> ${esc(q.e)}</div>`:""}`;
    } else {
      side.textContent="QUESTION · tap to flip";
      content.innerHTML=esc(q.q);
    }
  });
  $("flash-prev").addEventListener("click",()=>{if(S.idx>0){S.idx--;renderFlashcard();}});
  $("flash-next").addEventListener("click",()=>{S.idx++;renderFlashcard();});
  $("flash-exit").addEventListener("click",()=>{resetMode();showDifficultySelect(S.sub);});
  $("footer").textContent="🎴 Flashcards · tap card to flip · no scoring";
}

function startReview(sub){
  const weak=getWeakQuestions(sub);
  if(!weak.length)return;
  resetMode();
  S.sub=sub;S.lvl=0;S.review=true;
  // Synthesize a permissive "mode" for review
  S.mode={lvl:0,name:"REVIEW",icon:"⚠️",lives:999,pts:100,timer:0,hint:false,hintCost:0,desc:"Weak-spot drill"};
  S.queue=shuffle(weak);
  S.idx=0;S.score=0;S.correct=0;S.streak=0;S.best=0;S.lives=999;
  S.answered=false;S.hintUsed=false;
  $("hud").style.display="grid";
  $("subtitle").textContent=`${SUBS[sub].icon} ${SUBS[sub].name} · ⚠️ REVIEW`;
  updateHud();
  renderQ();
}

function renderQ(){
  if(S.lives<=0||S.idx>=S.queue.length){return gameOver();}
  S.answered=false;S.hintUsed=false;
  stopTimer();
  const q=S.queue[S.idx];
  const m=S.mode;
  const lvlNames=["","BEGINNER","EASY","MEDIUM","HARD"];
  const typeTag=q.type==="fill"?`<span class="lvl-tag l2" style="background:rgba(124,201,255,.12);color:var(--cyan);border-color:var(--cyan)">FILL</span>`:q.type==="multi"?`<span class="lvl-tag l3" style="background:rgba(255,209,102,.12);color:var(--yellow);border-color:var(--yellow)">MULTI</span>`:"";
  const starred=isStarred(q);
  $("main").innerHTML=`
    <button class="star-btn ${starred?"on":""}" id="star-btn" title="Bookmark this question" aria-label="Bookmark this question" aria-pressed="${starred}">${starred?"★":"☆"}</button>
    <span class="domain-tag">${esc(q.d)}</span><span class="lvl-tag l${q.lvl}">${lvlNames[q.lvl]}</span>${typeTag}
    <div class="question">${esc(q.q)}</div>
    <div class="answers" id="ans"></div>
    <div class="feedback" id="fb" role="status" aria-live="polite"></div>
    <div class="controls" id="ctrl"></div>
    <div style="text-align:center;margin-top:10px"><button class="cmd" id="quit-btn" style="font-size:10px;padding:6px 10px;opacity:.7">quit to menu</button></div>`;
  $("quit-btn").addEventListener("click",()=>{
    resetMode();S.answered=true;
    showDifficultySelect(S.sub);
  });
  $("star-btn").addEventListener("click",()=>{
    const on=toggleStar(q);
    const b=$("star-btn");
    b.classList.toggle("on",on);
    b.textContent=on?"★":"☆";
    b.setAttribute("aria-pressed",on);
  });
  const wrap=$("ans");

  if(q.type==="fill"){
    // Fill-in-the-blank
    wrap.innerHTML=`
      <div class="fill-wrap">
        <input type="text" class="fill-input" id="fill-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer…">
        <div class="fill-tip">↵ ENTER to submit · case-insensitive</div>
        <button class="cmd fill-submit" id="fill-submit">> SUBMIT</button>
      </div>`;
    const inp=$("fill-input");
    setTimeout(()=>inp.focus(),50);
    const submit=()=>pickFill(inp.value,q);
    $("fill-submit").addEventListener("click",submit);
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){e.preventDefault();submit();}
    });
  } else if(q.type==="multi"){
    // Multi-select (select all that apply)
    const order=shuffle(q.a.map((_,i)=>i));
    S._multiOrder=order;  // timeUp() needs this to mark the right buttons
    const correctSet=new Set(q.correct||[]);
    const labels=["A","B","C","D","E","F"];
    const pickedSet=new Set();
    order.forEach((origIdx,pos)=>{
      const b=document.createElement("button");
      b.className="answer-btn multi-btn";
      b.setAttribute("aria-pressed","false");
      b.dataset.pos=pos;
      b.innerHTML=`<span class="key-hint">${labels[pos]}</span><span class="chk">☐</span> ${esc(q.a[origIdx])}`;
      b.addEventListener("click",()=>{
        if(S.answered)return;
        if(pickedSet.has(pos)){pickedSet.delete(pos);b.classList.remove("selected");b.querySelector(".chk").textContent="☐";b.setAttribute("aria-pressed","false");}
        else{pickedSet.add(pos);b.classList.add("selected");b.querySelector(".chk").textContent="☑";b.setAttribute("aria-pressed","true");}
      });
      wrap.appendChild(b);
    });
    const ctrl=$("ctrl");
    const sb=document.createElement("button");
    sb.className="cmd multi-submit";
    sb.id="multi-submit";
    sb.textContent="> SUBMIT";
    sb.addEventListener("click",()=>pickMulti(pickedSet,order,correctSet,q));
    ctrl.appendChild(sb);
    const tip=document.createElement("div");
    tip.className="fill-tip";
    tip.style.marginTop="6px";
    tip.textContent=`Select ALL that apply · ${correctSet.size} correct`;
    wrap.appendChild(tip);
  } else {
    // Multiple choice (default) — shuffle answer order
    const order=shuffle(q.a.map((_,i)=>i));
    const correctPos=order.indexOf(q.c);
    S._correctPos=correctPos;
    const labels=["A","B","C","D"];
    order.forEach((origIdx,pos)=>{
      const b=document.createElement("button");
      b.className="answer-btn";
      b.dataset.pos=pos;
      b.innerHTML=`<span class="key-hint">${labels[pos]}</span>${esc(q.a[origIdx])}`;
      b.addEventListener("click",()=>pick(pos,correctPos,q));
      wrap.appendChild(b);
    });
    // Hint button (MC only)
    if(m.hint){
      const ctrl=$("ctrl");
      const hb=document.createElement("button");
      hb.className="cmd yellow hint-btn";
      hb.id="hint-btn";
      hb.textContent=m.hintCost>0?`💡 50/50 (-${m.hintCost}pts)`:"💡 50/50";
      hb.addEventListener("click",()=>useHint(correctPos));
      ctrl.appendChild(hb);
    }
  }
  updateHud();
  $("footer").textContent=`${m.name} · ${m.pts}pts per correct${m.timer?` · ${m.timer}s timer`:""}`;
  if(m.timer>0)startTimer();
}

function useHint(correctPos){
  if(S.hintUsed||S.answered)return;
  S.hintUsed=true;
  const m=S.mode;
  if(m.hintCost>0)S.score=Math.max(0,S.score-m.hintCost);
  // eliminate 2 wrong answers
  const btns=document.querySelectorAll(".answer-btn");
  let eliminated=0;
  btns.forEach((b,i)=>{
    if(i!==correctPos&&eliminated<2){
      b.classList.add("eliminated");
      b.disabled=true;
      eliminated++;
    }
  });
  $("hint-btn").disabled=true;
  $("hint-btn").style.opacity=".4";
  updateHud();
}

// ── Grading ──
// The ONE place an answer turns into points, lives and saved stats.
// pick(), pickMulti() and pickFill() each work out right/wrong for their own
// question type and colour their own buttons, then hand off to grade().
// (This logic used to be copy-pasted three times, so a scoring change had to
// be made three times and it was easy to miss one.)
function grade(q,correct,answerText){
  recordStat(q,correct);
  const m=S.mode;
  const fb=$("fb");
  if(correct){
    S.correct++;
    if(S.exam)S.examCorrect=(S.examCorrect||0)+1;
    S.streak++;S.best=Math.max(S.best,S.streak);
    const bonus=S.streak>=3?50:0;
    const pts=m.pts+bonus;
    S.score+=pts;
    bumpMeta(pts);
    fb.className="feedback good";
    fb.innerHTML=`✓ <b>Correct!</b> +${pts}${bonus?` <span style="color:var(--yellow)">🔥 Streak!</span>`:""}\n\n<strong>Why:</strong> ${esc(q.e)}`;
  } else {
    S.streak=0;S.lives--;
    bumpMeta(0); // still counts as studying today, for the day streak
    fb.className="feedback bad";
    fb.innerHTML=`✗ <b>Wrong.</b> Answer: <b style="color:var(--green)">${esc(answerText)}</b>\n\n<strong>Why:</strong> ${esc(q.e)}`;
  }
  updateHud();
  showNext();
}

function pick(pos,correctPos,q){
  if(S.answered)return;
  S.answered=true;
  stopTimer();
  document.querySelectorAll(".answer-btn").forEach((b,i)=>{
    b.disabled=true;
    if(i===correctPos)b.classList.add("correct");
    else if(i===pos)b.classList.add("wrong");
  });
  const hb=$("hint-btn");if(hb)hb.disabled=true;
  grade(q,pos===correctPos,q.a[q.c]);
}

function pickMulti(pickedSet,order,correctSet,q){
  if(S.answered)return;
  S.answered=true;
  stopTimer();
  // Buttons are shown shuffled. `order[pos]` converts a screen position back
  // to the option's original index in q.a, which is what q.correct refers to.
  const pickedOrig=new Set([...pickedSet].map(p=>order[p]));
  // All-or-nothing: correct only if the picked set EQUALS the correct set.
  let correct=pickedOrig.size===correctSet.size;
  if(correct){for(const i of correctSet){if(!pickedOrig.has(i)){correct=false;break;}}}
  document.querySelectorAll(".multi-btn").forEach((b,pos)=>{
    b.disabled=true;
    if(correctSet.has(order[pos]))b.classList.add("correct");
    else if(pickedSet.has(pos))b.classList.add("wrong");
  });
  const sb=$("multi-submit");if(sb)sb.disabled=true;
  grade(q,correct,[...correctSet].map(i=>q.a[i]).join(", "));
}

function pickFill(raw,q){
  if(S.answered)return;
  // "Normalise" both sides so harmless differences don't count as wrong:
  // trim the ends, lower-case, squeeze runs of spaces to one.
  const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
  const val=norm(raw);
  const inp=$("fill-input");
  // An empty submit is almost always a stray Enter, not an answer — ignore it
  // rather than charging a life.
  if(!val){if(inp)inp.focus();return;}
  S.answered=true;
  stopTimer();
  const correct=(q.answers||[]).map(norm).includes(val);
  if(inp){inp.disabled=true;inp.classList.add(correct?"correct":"wrong");}
  const sb=$("fill-submit");if(sb)sb.disabled=true;
  grade(q,correct,q.answers[0]);
}

function showNext(){
  const ctrl=$("ctrl");
  // clear old hint btn if present and add next
  [...ctrl.querySelectorAll(".cmd:not(.hint-btn)")].forEach(b=>b.remove());
  const isLast=S.idx+1>=S.queue.length||S.lives<=0;
  const nb=document.createElement("button");
  nb.className="cmd";
  nb.textContent=isLast?"> FINISH":"> NEXT";
  nb.addEventListener("click",()=>{S.idx++;renderQ();});
  ctrl.appendChild(nb);
  nb.focus();
}

// ─────────────────────────────────────────────────────────────
// GAME OVER
// ─────────────────────────────────────────────────────────────
function gameOver(){
  stopTimer();
  stopExamClock();
  const examClk=$("exam-clock");if(examClk)examClk.remove();
  $("timer-wrap").style.display="none";
  const wasExam=S.exam||S.examExpired;
  const prevHi=hi(S.sub,S.lvl);
  if(!S.review&&!wasExam)saveHi(S.sub,S.lvl,S.score);
  const total=S.queue.length;
  // Rank is based on questions answered correctly, NOT on points. Points
  // include streak bonuses, which used to push 12/15 (80%) over the 95% line.
  const pct=total>0?S.correct/total:0;
  // Exam uses correctness-based percentage, not score-based
  const examPct=wasExam&&S.examN?(S.examCorrect||0)/S.examN:0;
  const examPassed=wasExam&&examPct>=(S.examPass||0.75);
  const {rank,msg}=wasExam
    ?(examPassed
        ?{rank:"PASS",msg:`You scored ${Math.round(examPct*100)}% — above this app's ${Math.round((S.examPass||0.75)*100)}% practice bar. (Real exams are scaled and use a larger question pool, so treat this as a guide.)`}
        :{rank:"FAIL",msg:`You scored ${Math.round(examPct*100)}% — need ${Math.round((S.examPass||0.75)*100)}% to pass. Keep drilling.`})
    :S.review
    ?{rank:"DRILL DONE",msg:"Keep hammering — repetition builds mastery."}
    :pct>=.95?{rank:"ROOT GOD",msg:"You own this material."}
    :pct>=.80?{rank:"EXPERT",msg:"Nearly there — book the exam."}
    :pct>=.60?{rank:"PROFICIENT",msg:"Drill your weak areas and retry."}
    :pct>=.40?{rank:"LEARNING",msg:"Review the explanations and go again."}
    :{rank:"BEGINNER",msg:"Keep studying — everyone starts here."};
  const won=S.lives>0;
  const isNew=!S.review&&!wasExam&&S.score>prevHi;
  const ss=subjectStats(S.sub);
  const remainingWeak=getWeakQuestions(S.sub).length;
  const hdr=wasExam?(examPassed?"> EXAM PASSED":S.examExpired?"> TIME EXPIRED":"> EXAM FAILED"):S.review?"> REVIEW COMPLETE":won?"> SESSION COMPLETE":"> GAME OVER";
  const rankColor=wasExam?(examPassed?"var(--green)":"var(--red)"):"var(--green)";
  $("main").innerHTML=`
    <div class="over-screen">
      <h2 style="color:${rankColor}">${hdr}</h2>
      <div class="score-big" style="color:${rankColor}">${wasExam?Math.round(examPct*100)+"%":S.score}</div>
      ${wasExam
        ?`<div class="hi-score-line">${S.examCorrect||0} / ${S.examN} correct · score ${S.score}</div>`
        :S.review
        ?`<div class="hi-score-line" style="color:var(--red)">⚠️ ${remainingWeak} weak question${remainingWeak===1?"":"s"} still need work</div>`
        :isNew?`<div class="hi-score-line">🏆 New high score!</div>`:`<div class="hi-score-line">Best: ${hi(S.sub,S.lvl)}</div>`}
      <div class="rank-label" style="color:${rankColor}">[ ${rank} ]</div>
      <div class="rank-msg">${msg}</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="sv">${S.idx}</div><div class="sl">Answered</div></div>
        <div class="stat-box"><div class="sv">${S.best}</div><div class="sl">Best Streak</div></div>
        <div class="stat-box"><div class="sv">${wasExam?(S.examN-(S.examCorrect||0)):S.review?ss.missed:S.lives}</div><div class="sl">${wasExam?"Missed":S.review?"Total Missed":"Lives Left"}</div></div>
      </div>
      <div class="controls" style="justify-content:center;gap:10px">
        <button class="cmd" id="btn-retry">> ${S.review&&remainingWeak===0?"DONE":wasExam?"RETAKE":"RETRY"}</button>
        <button class="cmd cyan" id="btn-change">> CHANGE</button>
      </div>
    </div>`;
  $("progbar").style.width="100%";
  const retakeSub=S.sub;const wasExamClick=wasExam;
  $("btn-retry").addEventListener("click",()=>{
    if(wasExamClick){startExam(retakeSub);return;}
    if(S.due){showDifficultySelect(S.sub);return;}
    if(S.review){
      if(getWeakQuestions(S.sub).length>0)startReview(S.sub);
      else showDifficultySelect(S.sub);
    } else startGame(S.sub,S.lvl);
  });
  $("btn-change").addEventListener("click",showSubjectSelect);
  $("btn-retry").focus();
}

// ─────────────────────────────────────────────────────────────
// SPACED REPETITION (Leitner boxes)
// ─────────────────────────────────────────────────────────────
// Every question you have answered sits in a "box" numbered 0–5.
//   right answer -> moves up one box   -> you see it again after a LONGER gap
//   wrong answer -> drops back to box 0 -> it is due again immediately
// BOX_DAYS[box] is the gap in days. So material you know fades into the
// background, and material you miss keeps coming back until it sticks.
// The box and due date are stored on the same per-question record as
// seen/wrong (see recordStat), under the tq_stats key.
const DAY=86400000; // milliseconds in a day
const BOX_DAYS=[0,1,3,7,14,30];
function getDueQuestions(sub){
  const stats=loadStats(),now=Date.now();
  // Records saved before this feature have no `due`: treat ever-missed ones as due.
  const dueAt=st=>typeof st.due==="number"?st.due:(st.wrong>0?0:Infinity);
  return BANK.filter(q=>{
    if(sub&&q.sub!==sub)return false;
    const st=stats[qid(q)];
    return !!st&&dueAt(st)<=now;
  }).sort((a,b)=>dueAt(stats[qid(a)])-dueAt(stats[qid(b)])); // most overdue first
}
function startDue(sub){
  const due=getDueQuestions(sub).slice(0,20); // cap a session so it stays doable
  if(!due.length)return;
  resetMode();
  S.sub=sub;S.lvl=0;S.review=true;S.due=true;
  S.mode={lvl:0,name:"DAILY REVIEW",icon:"🧠",lives:999,pts:100,timer:0,hint:false,hintCost:0,desc:"Spaced repetition"};
  S.queue=due;
  S.idx=0;S.score=0;S.correct=0;S.streak=0;S.best=0;S.lives=999;
  S.answered=false;S.hintUsed=false;
  $("hud").style.display="grid";
  $("subtitle").textContent=`${SUBS[sub].icon} ${SUBS[sub].name} · 🧠 DAILY REVIEW`;
  updateHud();
  renderQ();
}

// ── XP and day streak (tq_meta) ──
function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function loadMeta(){
  const m=store.obj("tq_meta");
  // The unary + turns whatever was stored into a number, so a corrupt or
  // imported value can never end up on screen as text.
  return {xp:+m.xp||0,streak:+m.streak||0,best:+m.best||0,day:typeof m.day==="string"?m.day:""};
}
function bumpMeta(xp){
  const m=loadMeta(),today=dayKey(new Date());
  if(m.day!==today){
    const yesterday=dayKey(new Date(Date.now()-DAY));
    m.streak=m.day===yesterday?m.streak+1:1; // missed a day -> start over at 1
    m.best=Math.max(m.best,m.streak);
    m.day=today;
  }
  m.xp+=xp;
  store.set("tq_meta",JSON.stringify(m));
}
function currentStreak(){
  const m=loadMeta();
  const live=m.day===dayKey(new Date())||m.day===dayKey(new Date(Date.now()-DAY));
  return live?m.streak:0;
}

// ─────────────────────────────────────────────────────────────
// PROGRESS DASHBOARD
// ─────────────────────────────────────────────────────────────
// Everything here is CALCULATED from tq_stats each time the screen opens —
// nothing extra is stored, so the dashboard can never disagree with the data.
function subjectReport(sub){
  const stats=loadStats();
  const qs=BANK.filter(q=>q.sub===sub);
  let seenQ=0,attempts=0,wrong=0;
  const dom={};
  qs.forEach(q=>{
    const st=stats[qid(q)];if(!st)return;
    seenQ++;attempts+=+st.seen||0;wrong+=+st.wrong||0;
    const d=dom[q.d]||(dom[q.d]={name:q.d,attempts:0,wrong:0});
    d.attempts+=+st.seen||0;d.wrong+=+st.wrong||0;
  });
  const coverage=qs.length?seenQ/qs.length:0;          // how much of the bank you've tried
  const accuracy=attempts?(attempts-wrong)/attempts:0; // how often you were right
  // Readiness = accuracy x coverage. 90% right on 10% of the bank is not
  // "90% ready", so both have to be high for this number to be high.
  return {total:qs.length,seenQ,coverage,accuracy,readiness:Math.round(accuracy*coverage*100),
    domains:Object.values(dom).filter(d=>d.attempts>0).map(d=>({sub,name:d.name,attempts:d.attempts,acc:(d.attempts-d.wrong)/d.attempts}))};
}
function showDashboard(){
  resetMode();
  $("hud").style.display="none";
  $("subtitle").textContent="📊 Progress";
  $("footer").textContent="Readiness = accuracy × coverage of the question bank";
  const meta=loadMeta();
  const reps=SUB_ORDER.map(k=>({k,r:subjectReport(k)}));
  const pc=x=>Math.round(x*100)+"%";
  const rows=reps.map(({k,r})=>`<tr><td style="text-align:left">${SUBS[k].icon} ${SUBS[k].name}</td><td>${r.seenQ}/${r.total}</td><td>${r.seenQ?pc(r.accuracy):"–"}</td><td style="color:var(--green)">${r.readiness}%</td></tr>`).join("");
  // Weakest topics: need at least 3 attempts so one unlucky miss doesn't rank.
  const weak=reps.flatMap(x=>x.r.domains).filter(d=>d.attempts>=3).sort((a,b)=>a.acc-b.acc).slice(0,5);
  const weakHtml=weak.length
    ?weak.map(d=>`<div class="badge" style="display:block;margin:4px 0;font-size:11px">${SUBS[d.sub].icon} ${esc(d.name)} — <b style="color:var(--red)">${pc(d.acc)}</b> over ${d.attempts} attempts</div>`).join("")
    :`<div class="rank-msg">Answer a few more questions and your weakest topics will show here.</div>`;
  $("main").innerHTML=`
    <div class="diff-screen">
      <div class="back-row"><button class="back-btn" id="back-btn">&lt; back</button></div>
      <h2>&gt; PROGRESS</h2>
      <div class="stat-grid" style="max-width:none;margin:4px 0">
        <div class="stat-box"><div class="sv">🔥 ${currentStreak()}</div><div class="sl">Day streak (best ${meta.best})</div></div>
        <div class="stat-box"><div class="sv">${meta.xp}</div><div class="sl">Total XP</div></div>
        <div class="stat-box"><div class="sv">${getDueQuestions().length}</div><div class="sl">Due for review</div></div>
      </div>
      <table class="dash-table">
        <thead><tr><th style="text-align:left">Subject</th><th>Seen</th><th>Accuracy</th><th>Ready</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <h2 style="margin-top:8px">&gt; WEAKEST TOPICS</h2>
      <div>${weakHtml}</div>
      <h2 style="margin-top:8px">&gt; BACKUP</h2>
      <div class="rank-msg" style="text-align:center">Progress lives only in this browser. Export a backup file so clearing browser data or changing device doesn't lose it.</div>
      <div class="controls" style="justify-content:center">
        <button class="cmd" id="exp-btn">&gt; EXPORT</button>
        <button class="cmd cyan" id="imp-btn">&gt; IMPORT</button>
        <input type="file" id="imp-file" accept="application/json,.json" hidden>
      </div>
      <div class="feedback" id="imp-msg" role="status" aria-live="polite"></div>
    </div>`;
  $("back-btn").addEventListener("click",showSubjectSelect);
  $("exp-btn").addEventListener("click",exportProgress);
  $("imp-btn").addEventListener("click",()=>$("imp-file").click());
  $("imp-file").addEventListener("change",async e=>{
    const f=e.target.files[0];if(!f)return;
    if(!confirm("Importing REPLACES all progress in this browser with the file's contents. Continue?"))return;
    const err=importProgress(await f.text());
    if(err){const m=$("imp-msg");m.className="feedback bad";m.textContent=err;}
    else showDashboard();
  });
}

// ─────────────────────────────────────────────────────────────
// EXPORT / IMPORT
// ─────────────────────────────────────────────────────────────
// Every key this app saves starts with "tq_". Export bundles them into one
// JSON file; import puts them back.
function allKeys(){
  const ks=new Set(Object.keys(mem));
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("tq_"))ks.add(k);}}catch(e){}
  return [...ks];
}
function exportProgress(){
  const data={app:"techquest",version:1,exported:new Date().toISOString(),keys:{}};
  allKeys().forEach(k=>data.keys[k]=store.get(k));
  // Build the file in memory (a Blob) and click a temporary download link.
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
  a.download="techquest-progress-"+dayKey(new Date())+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// Returns "" on success or an error message. SECURITY: an imported file is
// untrusted input — it could be hand-edited or come from someone else. So we
// accept only keys that look like ours and values of the expected shape, and
// silently drop everything else rather than writing it into storage.
function importProgress(text){
  let d;
  try{d=JSON.parse(text);}catch(e){return "That file is not valid JSON.";}
  if(!d||d.app!=="techquest"||!d.keys||typeof d.keys!=="object")return "That is not a TechQuest backup file.";
  const clean={};
  for(const [k,v] of Object.entries(d.keys)){
    if(!/^tq_[a-z0-9_]{1,40}$/.test(k)||typeof v!=="string"||v.length>2000000)continue;
    if(k==="tq_stats"||k==="tq_starred"||k==="tq_meta"){
      try{const o=JSON.parse(v);if(!o||typeof o!=="object"||Array.isArray(o))continue;}catch(e){continue;}
    } else if(!/^\d{1,9}$/.test(v))continue; // high scores are plain whole numbers
    clean[k]=v;
  }
  if(!Object.keys(clean).length)return "No usable progress found in that file.";
  allKeys().forEach(k=>store.del(k));
  Object.entries(clean).forEach(([k,v])=>store.set(k,v));
  return "";
}

// ─────────────────────────────────────────────────────────────
// KEYBOARD
// ─────────────────────────────────────────────────────────────
document.addEventListener("keydown",e=>{
  // Don't hijack keys when typing in a fill-in-blank input
  if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"))return;
  // The subject/difficulty cards and the flashcard are <div role="button">.
  // A real <button> responds to Enter and Space for free; a div does not, so
  // we forward those two keys to a click ourselves.
  if(e.target&&e.target.getAttribute&&e.target.getAttribute("role")==="button"&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();e.target.click();return;
  }
  if(S.flash){
    const go=id=>{const b=$(id);if(b&&!b.disabled)b.click();};
    if(e.key==="ArrowRight")go("flash-next");
    else if(e.key==="ArrowLeft")go("flash-prev");
    else if(e.key===" "){e.preventDefault();go("flash-box");}
    return;
  }
  if(e.key==="Enter"){
    // A focused button already "clicks" itself on Enter. Clicking NEXT/RETRY
    // here as well made Enter on the CHANGE button restart the round instead.
    if(e.target&&e.target.tagName==="BUTTON")return;
    const b=document.querySelector("#ctrl .cmd:not(.hint-btn)")||$("btn-retry");
    if(b){b.click();return;}
  }
  if(e.key==="h"||e.key==="H"){
    const hb=$("hint-btn");if(hb&&!hb.disabled)hb.click();return;
  }
  if(!S.answered){
    const map={a:0,b:1,c:2,d:3,e:4,f:5,"1":0,"2":1,"3":2,"4":3,"5":4,"6":5};
    const idx=map[e.key.toLowerCase()];
    if(idx!==undefined){
      const allBtns=document.querySelectorAll(".answer-btn");
      if(allBtns[idx]&&!allBtns[idx].disabled)allBtns[idx].click();
    }
  }
});
